
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu App de Tarefas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f8;
      margin: 0;
      padding: 30px 15px;
      color: #222;
    }
    .app {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 20px #0001;
    }
    h1 { margin-top: 0; }
    .form { display: flex; gap: 8px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      padding: 12px;
      background: #243b63;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    ul { padding: 0; list-style: none; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }
    li span { flex: 1; overflow-wrap: anywhere; }
    .done { text-decoration: line-through; color: #888; }
    .delete { background: #b43b3b; }
    #summary { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <main class="app">
    <h1>Minhas Tarefas</h1>
    <p>Meu primeiro aplicativo!</p>

    <form id="form" class="form">
      <input id="task" placeholder="Nova tarefa"
             maxlength="150" required>
      <button type="submit">Adicionar</button>
    </form>

    <ul id="list"></ul>
    <p id="summary"></p>
  </main>

  <script>
    const key = "minhas-tarefas-v1";
    let tasks = [];

    try {
      tasks = JSON.parse(localStorage.getItem(key)) || [];
      if (!Array.isArray(tasks)) tasks = [];
    } catch {
      tasks = [];
    }

    function save() {
      localStorage.setItem(key, JSON.stringify(tasks));
    }

    function render() {
      const list = document.getElementById("list");
      list.replaceChildren();

      tasks.forEach((task) => {
        const li = document.createElement("li");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;

        checkbox.onchange = () => {
          task.done = checkbox.checked;
          save();
          render();
        };

        const span = document.createElement("span");
        span.textContent = task.name;
        if (task.done) span.className = "done";

        const remove = document.createElement("button");
        remove.textContent = "Excluir";
        remove.className = "delete";
        remove.onclick = () => {
          tasks = tasks.filter(t => t.id !== task.id);
          save();
          render();
        };

        li.append(checkbox, span, remove);
        list.append(li);
      });

      const completed = tasks.filter(t => t.done).length;
      document.getElementById("summary").textContent =
        `${completed} de ${tasks.length} tarefas concluídas`;
    }

    document.getElementById("form").onsubmit = (event) => {
      event.preventDefault();

      const input = document.getElementById("task");
      const name = input.value.trim();
      if (!name) return;

      tasks.push({
        id: crypto.randomUUID(),
        name,
        done: false
      });

      save();
      render();
      input.value = "";
      input.focus();
    };

    render();
  </script>
</body>
</html>
