<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu App de Tarefas</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f3f5f8; margin: 0; padding: 30px 15px; color: #222; }
    .app { max-width: 680px; margin: auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px #0001; }
    h1 { margin-top: 0; }
    .form, .filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
    .name { flex: 1 1 100%; }
    .wide { flex: 1 1 100%; }
    .tag { background: #edf2f8; color: #243b63; padding: 3px 7px; border-radius: 5px; }
    input:not([type="checkbox"]), select, button { font: inherit; padding: 12px; border: 1px solid #bbb; border-radius: 8px; max-width: 100%; }
    input, select { background: white; color: #222; }
    button { background: #243b63; color: white; border: none; cursor: pointer; }
    :focus-visible { outline: 3px solid #3479d5; outline-offset: 3px; }
    .filters { margin-top: 24px; padding-top: 20px; border-top: 1px solid #ddd; }
    .filters label { flex: 1; min-width: 150px; }
    ul { padding: 0; list-style: none; }
    li { display: flex; align-items: center; gap: 12px; padding: 16px 0; border-bottom: 1px solid #eee; }
    input[type="checkbox"] { width: 20px; height: 20px; flex-shrink: 0; }
    .details { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .done .task-name { text-decoration: line-through; color: #666; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 7px; font-size: 13px; color: #555; }
    .priority { padding: 3px 7px; border-radius: 5px; background: #edf2f8; }
    .high { background: #fce6e6; color: #8c2020; }
    .low { background: #e8f4eb; color: #246336; }
    .overdue { color: #a02121; font-weight: bold; }
    .delete { background: #a32f2f; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .cancel { background: #586274; }
    #edit-message { color: #243b63; font-weight: bold; }
    @media (max-width: 440px) { li { flex-wrap: wrap; } .actions { width: 100%; justify-content: flex-end; } }
    #summary, #empty { color: #555; font-size: 14px; }
    #storage-message { color: #a02121; }
    @media (max-width: 440px) { .app { padding: 18px; } .form > label:not(.name) { flex: 1 1 100%; } }
  </style>
</head>
<body>
  <main class="app">
    <h1>Minhas Tarefas</h1>
    <p>Organize suas tarefas por prioridade e prazo.</p>
    <p id="edit-message" role="status" hidden></p>
    <form id="form" class="form">
      <label class="name" for="task">Tarefa
        <input id="task" placeholder="O que você precisa fazer?" maxlength="150" required>
      </label>
      <label for="priority">Prioridade
        <select id="priority"><option value="low">Baixa</option><option value="medium" selected>Média</option><option value="high">Alta</option></select>
      </label>
      <label for="due-date">Prazo (opcional)<input id="due-date" type="date" min="0001-01-01" max="9999-12-31"></label>
      <label class="wide" for="assignee">Responsável (opcional)
        <input id="assignee" maxlength="80" placeholder="Ex.: Ana Souza">
      </label>
      <label class="wide" for="tags">Tags (opcional, separadas por vírgula)
        <input id="tags" maxlength="300" placeholder="Ex.: vendas, cliente, urgente" aria-describedby="tags-help">
        <small id="tags-help">Até 10 tags, com até 30 caracteres cada.</small>
      </label>
      <button id="submit-task" type="submit">Adicionar</button>
      <button id="cancel-edit" class="cancel" type="button" hidden>Cancelar edição</button>
    </form>
    <div class="filters" role="group" aria-label="Filtros de tarefas">
      <label class="wide" for="search">Pesquisar tarefas
        <input id="search" type="search" placeholder="Busque por texto, tag ou responsável">
      </label>
      <label for="status-filter">Mostrar
        <select id="status-filter"><option value="all">Todas</option><option value="pending">Pendentes</option><option value="done">Concluídas</option></select>
      </label>
      <label for="priority-filter">Prioridade
        <select id="priority-filter"><option value="all">Todas as prioridades</option><option value="high">Alta</option><option value="medium">Média</option><option value="low">Baixa</option></select>
      </label>
    </div>
    <p id="storage-message" role="alert" hidden></p>
    <ul id="list" aria-label="Tarefas"></ul>
    <p id="empty" hidden></p>
    <p id="summary" role="status"></p>
  </main>
  <script>
    const key = "minhas-tarefas-v1";
    const priorityNames = { low: "Baixa", medium: "Média", high: "Alta" };
    const byId = id => document.getElementById(id);
    let tasks = [];
    let editingId = null;
    const normalizeText = value => value.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLocaleLowerCase("pt-BR");
    function parseTags(value) {
      const seen = new Set();
      return value.split(",").map(tag => tag.trim().slice(0, 30)).filter(tag => {
        const normalized = normalizeText(tag);
        if (!tag || seen.has(normalized)) return false;
        seen.add(normalized);
        return true;
      }).slice(0, 10);
    }
    function finishEditing() {
      editingId = null;
      byId("task").value = "";
      byId("priority").value = "medium";
      byId("due-date").value = "";
      byId("tags").value = "";
      byId("assignee").value = "";
      byId("submit-task").textContent = "Adicionar";
      byId("cancel-edit").hidden = true;
      byId("edit-message").hidden = true;
    }
    function startEditing(task) {
      editingId = task.id;
      byId("task").value = task.name;
      byId("priority").value = task.priority;
      byId("due-date").value = task.dueDate;
      byId("tags").value = task.tags.join(", ");
      byId("assignee").value = task.assignee;
      byId("submit-task").textContent = "Salvar alterações";
      byId("cancel-edit").hidden = false;
      byId("edit-message").textContent = "Editando tarefa. Altere os campos abaixo e salve, ou cancele para manter a versão anterior.";
      byId("edit-message").hidden = false;
      byId("task").focus();
    }
    // Mantém a chave original para aproveitar as tarefas já cadastradas.
    function validDate(value) {
      if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
      const date = new Date(value + "T12:00:00");
      return !Number.isNaN(date.getTime()) && date.getFullYear() > 0 &&
        `${String(date.getFullYear()).padStart(4, "0")}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}` === value;
    }
    function storageMessage(message) {
      byId("storage-message").textContent = message;
      byId("storage-message").hidden = !message;
    }
    try {
      const stored = JSON.parse(localStorage.getItem(key)) || [];
      if (!Array.isArray(stored)) throw new Error("Formato inválido");
      tasks = stored.filter(task => task && typeof task.name === "string").map(task => ({
        id: typeof task.id === "string" ? task.id : crypto.randomUUID(),
        name: task.name,
        done: task.done === true,
        priority: Object.hasOwn(priorityNames, task.priority) ? task.priority : "medium",
        dueDate: validDate(task.dueDate) ? task.dueDate : "",
        tags: Array.isArray(task.tags) ? parseTags(task.tags.filter(tag => typeof tag === "string").join(",")) : [],
        assignee: typeof task.assignee === "string" ? task.assignee.trim().slice(0, 80) : ""
      }));
    } catch {
      storageMessage("Não foi possível carregar as tarefas salvas. Os dados existentes não foram alterados. Novas alterações tentarão salvar a lista atual.");
    }
    function save() {
      try {
        localStorage.setItem(key, JSON.stringify(tasks));
        storageMessage("");
      } catch {
        storageMessage("Não foi possível salvar neste navegador. As alterações atuais podem ser perdidas ao fechar ou recarregar a página.");
      }
    }
    function localToday() {
      const date = new Date();
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }
    function render() {
      const list = byId("list");
      list.replaceChildren();
      const status = byId("status-filter").value;
      const priority = byId("priority-filter").value;
      const terms = normalizeText(byId("search").value.trim()).split(/\s+/).filter(Boolean);
      const visible = tasks.filter(task =>
        (status === "all" || (status === "done" ? task.done : !task.done)) &&
        (priority === "all" || task.priority === priority) &&
        terms.every(term => normalizeText([task.name, task.assignee, ...task.tags].join(" ")).includes(term)));
      const today = localToday();
      visible.forEach(task => {
        const li = document.createElement("li");
        if (task.done) li.className = "done";
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.setAttribute("aria-label", `Marcar ${task.name} como ${task.done ? "pendente" : "concluída"}`);
        checkbox.onchange = () => { task.done = checkbox.checked; save(); render(); };
        const details = document.createElement("div");
        details.className = "details";
        const name = document.createElement("span");
        name.className = "task-name";
        name.textContent = task.name;
        const meta = document.createElement("div");
        meta.className = "meta";
        const badge = document.createElement("span");
        badge.className = `priority ${task.priority}`;
        badge.textContent = `Prioridade: ${priorityNames[task.priority]}`;
        meta.append(badge);
        const person = document.createElement("span");
        person.textContent = task.assignee ? `Responsável: ${task.assignee}` : "Sem responsável";
        meta.append(person);
        task.tags.forEach(tag => {
          const tagElement = document.createElement("span");
          tagElement.className = "tag";
          tagElement.textContent = `#${tag}`;
          meta.append(tagElement);
        });
        if (task.dueDate) {
          const date = document.createElement("span");
          const overdue = !task.done && task.dueDate < today;
          date.className = overdue ? "overdue" : "";
          date.textContent = `Prazo: ${task.dueDate.split("-").reverse().join("/")}${overdue ? " · Atrasada" : ""}`;
          meta.append(date);
        }
        details.append(name, meta);
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "Excluir";
        remove.className = "delete";
        remove.setAttribute("aria-label", `Excluir ${task.name}`);
        remove.onclick = () => {
          if (editingId === task.id) finishEditing();
          tasks = tasks.filter(item => item.id !== task.id); save(); render();
        };
        const edit = document.createElement("button");
        edit.type = "button";
        edit.textContent = "Editar";
        edit.setAttribute("aria-label", `Editar ${task.name}`);
        edit.onclick = () => startEditing(task);
        const actions = document.createElement("div");
        actions.className = "actions";
        actions.append(edit, remove);
        li.append(checkbox, details, actions);
        list.append(li);
      });
      byId("empty").hidden = visible.length > 0;
      byId("empty").textContent = tasks.length ? "Nenhuma tarefa corresponde aos filtros." : "Nenhuma tarefa cadastrada. Adicione sua primeira tarefa acima.";
      const completed = tasks.filter(task => task.done).length;
      byId("summary").textContent = `${completed} de ${tasks.length} tarefas concluídas · ${visible.length} exibidas`;
    }
    byId("form").onsubmit = event => {
      event.preventDefault();
      const input = byId("task");
      const name = input.value.trim();
      if (!name) { input.focus(); return; }
      const dueDate = byId("due-date").value;
      if (dueDate && !validDate(dueDate)) return;
      const tags = parseTags(byId("tags").value);
      const assignee = byId("assignee").value.trim().slice(0, 80);
      if (editingId !== null) {
        const task = tasks.find(item => item.id === editingId);
        if (!task) { finishEditing(); render(); return; }
        task.name = name;
        task.priority = byId("priority").value;
        task.dueDate = dueDate;
        task.tags = tags;
        task.assignee = assignee;
      } else {
        tasks.push({ id: crypto.randomUUID(), name, done: false, priority: byId("priority").value, dueDate, tags, assignee });
      }
      save();
      finishEditing();
      render();
      input.value = "";
      input.focus();
    };
    byId("status-filter").onchange = render;
    byId("cancel-edit").onclick = () => { finishEditing(); byId("task").focus(); };
    byId("priority-filter").onchange = render;
    byId("search").oninput = render;
    // Atualiza o aviso de atraso quando o usuário volta à página.
    window.addEventListener("focus", render);
    render();
  </script>
</body>
</html>
